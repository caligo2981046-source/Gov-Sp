    h1 {
      font-size: 3em;
      margin-bottom: 20px;

    p {

      line-height: 1.6;

      margin-top: 20px;
      border-radius: 10px;
      opacity: 0; /* começa invisível */
      animation: fadeIn 4s ease-in-out forwards; /* aplica fade-in */
    }
    @keyframes fadeIn {
      from {opacity: 0;}
      to {opacity: 1;}
    }
  </style>
